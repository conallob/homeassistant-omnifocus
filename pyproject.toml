[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "ASYNC", "RUF"]
ignore = ["S101", "S105", "S106", "E501", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
